<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FeedCull</title>
<style>
  body { width: 260px; font: 13px/1.5 system-ui, sans-serif; margin: 0;
         background: #0d1117; color: #c9d1d9; }
  header { padding: 12px 14px; border-bottom: 1px solid #21262d; }
  h1 { margin: 0; font-size: 15px; color: #f0f6fc; }
  h1 span { color: #e5484d; }
  main { padding: 12px 14px; }
  .row { display: flex; justify-content: space-between; align-items: center;
         margin-bottom: 10px; }
  label { color: #8b949e; }
  select { background: #161b22; color: #c9d1d9; border: 1px solid #30363d;
           border-radius: 4px; padding: 3px 6px; }
  button { width: 100%; background: #e5484d; color: #fff; border: 0;
           border-radius: 4px; padding: 7px; cursor: pointer; margin-top: 6px; }
  button.secondary { background: #21262d; color: #c9d1d9; }
  .stat { text-align: center; color: #8b949e; margin: 8px 0; }
  .stat b { color: #f0f6fc; }
  a { color: #58a6ff; text-decoration: none; display: block; text-align: center;
      margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
  <header><h1>Feed<span>Cull</span></h1></header>
  <main>
    <div class="row">
      <label for="siteToggle">Cull on this site</label>
      <input type="checkbox" id="siteToggle">
    </div>
    <div class="row">
      <label for="sensitivity">Sensitivity</label>
      <select id="sensitivity">
        <option value="low">Low (only obvious)</option>
        <option value="med" selected>Medium</option>
        <option value="high">High (aggressive)</option>
      </select>
    </div>
    <button id="cullDomain">Cull this site's domain</button>
    <div class="stat" id="stat">Culled today: <b>0</b></div>
    <button class="secondary" id="openOptions">Options — killfiles &amp; topics</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
